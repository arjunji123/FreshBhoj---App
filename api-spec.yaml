openapi: 3.1.0

info:
  title: FreshBhoj API
  version: 1.0.0
  description: |
    Production API specification for the FreshBhoj mobile app.
    Covers authentication, user profile, home feed, food items,
    kitchens, cart, orders, subscriptions, search, and media upload.

    **Generated from:** Full React Native codebase analysis (v0.0.1)

    ## Auth Flow
    1. `POST /auth/send-otp` → user receives 6-digit OTP via SMS
    2. `POST /auth/verify-otp` → returns `accessToken` + `refreshToken`
    3. Pass `Authorization: Bearer <accessToken>` on all protected endpoints
    4. Use `POST /auth/refresh-token` when the access token expires (TTL 1h)

  contact:
    name: FreshBhoj Engineering
    email: engineering@freshbhoj.com
  license:
    name: Private

servers:
  - url: https://api.freshbhoj.com/v1
    description: Production
  - url: https://stage-api.freshbhoj.com/v1
    description: Staging
  - url: https://dev-api.freshbhoj.com/v1
    description: Development

# ---------------------------------------------------------------------------
# Security
# ---------------------------------------------------------------------------

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256-signed JWT. Expires in 1 hour.

  # -------------------------------------------------------------------------
  # Reusable Parameters
  # -------------------------------------------------------------------------

  parameters:
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-indexed)

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Number of results per page

    LatParam:
      name: lat
      in: query
      schema:
        type: number
        format: float
        minimum: -90
        maximum: 90
      description: User latitude

    LngParam:
      name: lng
      in: query
      schema:
        type: number
        format: float
        minimum: -180
        maximum: 180
      description: User longitude

    RadiusParam:
      name: radiusKm
      in: query
      schema:
        type: number
        format: float
        minimum: 0.5
        maximum: 50
        default: 5
      description: Search radius in kilometres

  # -------------------------------------------------------------------------
  # Reusable Schemas
  # -------------------------------------------------------------------------

  schemas:

    # ------------------------------------------------------------------
    # Primitives / shared shapes
    # ------------------------------------------------------------------

    SuccessEnvelope:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          description: Endpoint-specific payload

    PaginatedMeta:
      type: object
      required: [page, limit, total]
      properties:
        page:
          type: integer
          examples:
            - 1
        limit:
          type: integer
          examples:
            - 20
        total:
          type: integer
          examples:
            - 148

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples:
                - INVALID_OTP
            message:
              type: string
              examples:
                - The OTP you entered is incorrect.
            details:
              type: object
              additionalProperties: true

    Location:
      type: object
      required: [address, latitude, longitude]
      properties:
        address:
          type: string
          maxLength: 255
          examples:
            - "Koramangala, Bengaluru, Karnataka 560034"
        latitude:
          type: number
          format: float
          minimum: -90
          maximum: 90
          examples:
            - 12.9352
        longitude:
          type: number
          format: float
          minimum: -180
          maximum: 180
          examples:
            - 77.6245
        landmark:
          type: ["string", "null"]
          maxLength: 100
          examples:
            - "Near Forum Mall"

    # ------------------------------------------------------------------
    # Auth
    # ------------------------------------------------------------------

    PhoneNumber:
      type: string
      pattern: '^\d{10}$'
      description: 10-digit Indian mobile number (without country code)
      examples:
        - "9876543210"

    CountryCode:
      type: string
      default: "+91"
      examples:
        - "+91"

    OtpCode:
      type: string
      pattern: '^\d{6}$'
      description: 6-digit one-time password
      examples:
        - "123456"

    TokenPair:
      type: object
      required: [accessToken, refreshToken, accessTokenExpiresAt, refreshTokenExpiresAt]
      properties:
        accessToken:
          type: string
          description: RS256-signed JWT. TTL 1 hour.
          examples:
            - "eyJhbGciOiJSUzI1NiJ9..."
        refreshToken:
          type: string
          description: Opaque random token. TTL 30 days. Store in device Keychain.
          examples:
            - "rt_a1b2c3d4e5f6..."
        accessTokenExpiresAt:
          type: string
          format: date-time
          examples:
            - "2026-04-12T13:30:00Z"
        refreshTokenExpiresAt:
          type: string
          format: date-time
          examples:
            - "2026-05-12T12:00:00Z"

    # ------------------------------------------------------------------
    # User
    # ------------------------------------------------------------------

    User:
      type: object
      required: [id, phoneNumber, countryCode, isNewUser, profileComplete, createdAt]
      properties:
        id:
          type: string
          description: ULID
          examples:
            - "usr_01HXYZ"
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        isNewUser:
          type: boolean
          description: True on first-ever login. Frontend uses this to decide whether to show PersonalDetails flow.
          examples:
            - true
        profileComplete:
          type: boolean
          description: True once both profile and location have been saved.
          examples:
            - false
        fullName:
          type: ["string", "null"]
          examples:
            - "Sumit Sharma"
        email:
          type: ["string", "null"]
          format: email
          examples:
            - "sumit@email.com"
        profileImageUrl:
          type: ["string", "null"]
          format: uri
          examples:
            - "https://cdn.freshbhoj.com/users/usr_01HXYZ/avatar.jpg"
        location:
          oneOf:
            - type: "null"
            - $ref: '#/components/schemas/Location'
        rememberMe:
          type: boolean
          examples:
            - true
        createdAt:
          type: string
          format: date-time
          examples:
            - "2026-04-12T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          examples:
            - "2026-04-12T12:10:00Z"

    # ------------------------------------------------------------------
    # Category
    # ------------------------------------------------------------------

    Category:
      type: object
      required: [id, name, slug, displayOrder]
      properties:
        id:
          type: string
          examples:
            - "cat_01"
        name:
          type: string
          examples:
            - "Fast Food"
        slug:
          type: string
          examples:
            - "fast-food"
        iconUrl:
          type: ["string", "null"]
          format: uri
          examples:
            - null
        displayOrder:
          type: integer
          examples:
            - 1

    # ------------------------------------------------------------------
    # Kitchen
    # ------------------------------------------------------------------

    KitchenSummary:
      type: object
      required: [id, name, rating, reviewCount, distanceKm, deliveryTimeMinutes, isOpen]
      properties:
        id:
          type: string
          examples:
            - "ktn_01"
        name:
          type: string
          examples:
            - "Amma's Kitchen"
        description:
          type: ["string", "null"]
          examples:
            - "Home-style South Indian meals"
        profileImageUrl:
          type: ["string", "null"]
          format: uri
          examples:
            - "https://cdn.freshbhoj.com/kitchens/ktn_01.jpg"
        storyImageUrl:
          type: ["string", "null"]
          format: uri
          examples:
            - "https://cdn.freshbhoj.com/stories/ktn_01.jpg"
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
          examples:
            - 4.8
        reviewCount:
          type: integer
          examples:
            - 342
        distanceKm:
          type: number
          format: float
          examples:
            - 0.8
        deliveryTimeMinutes:
          type: integer
          examples:
            - 30
        minimumOrderRs:
          type: integer
          examples:
            - 150
        deliveryFeeRs:
          type: integer
          examples:
            - 0
        categories:
          type: array
          items:
            type: string
          examples:
            - ["thali", "curry"]
        offersSubscription:
          type: boolean
          examples:
            - true
        isOpen:
          type: boolean
          examples:
            - true

    KitchenDetail:
      allOf:
        - $ref: '#/components/schemas/KitchenSummary'
        - type: object
          properties:
            address:
              type: string
              examples:
                - "HSR Layout, Bengaluru"
            latitude:
              type: number
              format: float
              examples:
                - 12.9355
            longitude:
              type: number
              format: float
              examples:
                - 77.6248
            openingTime:
              type: string
              examples:
                - "08:00"
            closingTime:
              type: string
              examples:
                - "20:00"
            menuItems:
              type: array
              items:
                $ref: '#/components/schemas/FoodItem'
            subscriptionPlans:
              type: array
              items:
                $ref: '#/components/schemas/SubscriptionPlan'

    KitchenStory:
      type: object
      required: [id, kitchenId, kitchenName, storyImageUrl, expiresAt]
      properties:
        id:
          type: string
          examples:
            - "kst_01"
        kitchenId:
          type: string
          examples:
            - "ktn_01"
        kitchenName:
          type: string
          examples:
            - "Amma's Kitchen"
        storyImageUrl:
          type: string
          format: uri
          examples:
            - "https://cdn.freshbhoj.com/stories/kst_01.jpg"
        storyVideoUrl:
          type: ["string", "null"]
          format: uri
          examples:
            - null
        expiresAt:
          type: string
          format: date-time
          examples:
            - "2026-04-12T23:59:59Z"

    # ------------------------------------------------------------------
    # Food Item
    # ------------------------------------------------------------------

    FoodItem:
      type: object
      required: [id, name, kitchenId, restaurantName, priceRs, rating, reviewCount, isVeg, isAvailable, isFavorite]
      properties:
        id:
          type: string
          examples:
            - "food_01"
        name:
          type: string
          examples:
            - "Paneer Butter Masala"
        description:
          type: ["string", "null"]
          examples:
            - "Rich, creamy tomato-based curry with soft paneer cubes"
        imageUrl:
          type: ["string", "null"]
          format: uri
          examples:
            - "https://cdn.freshbhoj.com/food/food_01.jpg"
        rating:
          type: number
          format: float
          minimum: 0
          maximum: 5
          examples:
            - 4.5
        reviewCount:
          type: integer
          examples:
            - 128
        restaurantId:
          type: string
          examples:
            - "ktn_01"
        restaurantName:
          type: string
          examples:
            - "Amma's Kitchen"
        kitchenId:
          type: string
          examples:
            - "ktn_01"
        distanceKm:
          type: number
          format: float
          examples:
            - 1.2
        priceRs:
          type: integer
          description: Price in Indian Rupees (whole number)
          examples:
            - 180
        isFavorite:
          type: boolean
          examples:
            - false
        isVeg:
          type: boolean
          examples:
            - true
        isAvailable:
          type: boolean
          examples:
            - true
        categorySlug:
          type: ["string", "null"]
          examples:
            - "curry"
        tags:
          type: array
          items:
            type: string
          examples:
            - ["popular", "bestseller"]

    # ------------------------------------------------------------------
    # Cart
    # ------------------------------------------------------------------

    CartItem:
      type: object
      required: [id, foodItemId, name, quantity, priceRs, lineTotalRs, kitchenId, kitchenName]
      properties:
        id:
          type: string
          examples:
            - "citem_01"
        foodItemId:
          type: string
          examples:
            - "food_01"
        name:
          type: string
          examples:
            - "Paneer Butter Masala"
        imageUrl:
          type: ["string", "null"]
          format: uri
        quantity:
          type: integer
          minimum: 1
          maximum: 10
          examples:
            - 2
        priceRs:
          type: integer
          examples:
            - 180
        lineTotalRs:
          type: integer
          examples:
            - 360
        kitchenId:
          type: string
          examples:
            - "ktn_01"
        kitchenName:
          type: string
          examples:
            - "Amma's Kitchen"

    Cart:
      type: object
      required: [id, items, subtotalRs, deliveryFeeRs, taxRs, totalRs, itemCount]
      properties:
        id:
          type: string
          examples:
            - "cart_01"
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
        subtotalRs:
          type: integer
          examples:
            - 360
        deliveryFeeRs:
          type: integer
          examples:
            - 0
        taxRs:
          type: integer
          examples:
            - 18
        totalRs:
          type: integer
          examples:
            - 378
        itemCount:
          type: integer
          examples:
            - 1
        estimatedDeliveryMinutes:
          type: ["integer", "null"]
          examples:
            - 30

    # ------------------------------------------------------------------
    # Orders
    # ------------------------------------------------------------------

    OrderStatus:
      type: string
      enum:
        - delivering_today
        - preparing
        - scheduled
        - paused
        - placed
        - out_for_delivery
        - delivered
        - cancelled
      examples:
        - delivering_today

    ActiveOrder:
      type: object
      required: [id, title, status, statusLabel, kitchenName, kitchenId]
      properties:
        id:
          type: string
          examples:
            - "ord_01"
        title:
          type: string
          examples:
            - "Daily Lunch Tiffin"
        type:
          type: string
          enum: [subscription, one_time]
          examples:
            - subscription
        status:
          $ref: '#/components/schemas/OrderStatus'
        statusLabel:
          type: string
          examples:
            - "Delivering Today"
        statusColor:
          type: string
          description: Hex color for the status badge
          examples:
            - "#22C55E"
        nextDeliveryTime:
          type: ["string", "null"]
          examples:
            - "12:30 PM"
        nextDeliveryDate:
          type: ["string", "null"]
          format: date
          examples:
            - "2026-04-12"
        kitchenName:
          type: string
          examples:
            - "Amma's Kitchen"
        kitchenId:
          type: string
          examples:
            - "ktn_01"
        kitchenImageUrl:
          type: ["string", "null"]
          format: uri
        deliveryAddress:
          type: ["string", "null"]
          examples:
            - "Koramangala, Bengaluru"
        scheduleDetails:
          type: ["object", "null"]
          properties:
            daysOfWeek:
              type: array
              items:
                type: string
              examples:
                - ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"]
            deliveryTime:
              type: string
              examples:
                - "12:30 PM"
            startDate:
              type: string
              format: date
              examples:
                - "2026-04-01"
            endDate:
              type: ["string", "null"]
              format: date
              examples:
                - "2026-04-30"

    DeliveryEntry:
      type: object
      required: [date, dayLabel, deliveryTime, status]
      properties:
        date:
          type: string
          format: date
          examples:
            - "2026-04-12"
        dayLabel:
          type: string
          examples:
            - "Today"
        deliveryTime:
          type: string
          examples:
            - "12:30 PM"
        status:
          type: string
          enum:
            - scheduled
            - out_for_delivery
            - delivered
            - skipped
            - cancelled
          examples:
            - out_for_delivery
        trackingAvailable:
          type: boolean
          examples:
            - true

    OrderDetail:
      type: object
      required: [id, userId, kitchenId, type, status, totalRs, createdAt]
      properties:
        id:
          type: string
          examples:
            - "ord_01"
        userId:
          type: string
          examples:
            - "usr_01HXYZ"
        kitchenId:
          type: string
          examples:
            - "ktn_01"
        kitchenName:
          type: string
          examples:
            - "Amma's Kitchen"
        subscriptionId:
          type: ["string", "null"]
          examples:
            - "sub_01"
        type:
          type: string
          enum: [subscription, one_time]
        status:
          $ref: '#/components/schemas/OrderStatus'
        title:
          type: ["string", "null"]
          examples:
            - "Daily Lunch Tiffin"
        items:
          type: array
          items:
            type: object
            required: [foodItemId, name, priceRs, quantity, lineTotalRs]
            properties:
              foodItemId:
                type: string
              name:
                type: string
              priceRs:
                type: integer
              quantity:
                type: integer
              lineTotalRs:
                type: integer
        subtotalRs:
          type: integer
          examples:
            - 360
        deliveryFeeRs:
          type: integer
          examples:
            - 0
        taxRs:
          type: integer
          examples:
            - 18
        totalRs:
          type: integer
          examples:
            - 378
        deliveryAddress:
          $ref: '#/components/schemas/Location'
        deliveredAt:
          type: ["string", "null"]
          format: date-time
        cancelledAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
          examples:
            - "2026-04-12T12:00:00Z"
        updatedAt:
          type: string
          format: date-time
          examples:
            - "2026-04-12T12:00:00Z"

    # ------------------------------------------------------------------
    # Subscriptions
    # ------------------------------------------------------------------

    SubscriptionPlan:
      type: object
      required: [id, kitchenId, name, priceRs, billingCycle, mealsPerDay, daysPerWeek, deliveryTimes, isVeg]
      properties:
        id:
          type: string
          examples:
            - "plan_01"
        kitchenId:
          type: string
          examples:
            - "ktn_01"
        name:
          type: string
          examples:
            - "Monthly Lunch Tiffin"
        description:
          type: ["string", "null"]
          examples:
            - "2 rotis + sabzi + dal + rice + salad"
        priceRs:
          type: integer
          examples:
            - 2999
        billingCycle:
          type: string
          enum: [weekly, monthly]
          examples:
            - monthly
        mealsPerDay:
          type: integer
          minimum: 1
          examples:
            - 1
        daysPerWeek:
          type: integer
          minimum: 1
          maximum: 7
          examples:
            - 5
        deliveryTimes:
          type: array
          items:
            type: string
          examples:
            - ["12:30 PM"]
        isVeg:
          type: boolean
          examples:
            - true
        trialDays:
          type: integer
          minimum: 0
          examples:
            - 3
        cancellationPolicy:
          type: ["string", "null"]
          examples:
            - "Cancel anytime, 24h notice"

    Subscription:
      type: object
      required: [id, userId, planId, kitchenId, status, startDate, deliveryTime]
      properties:
        id:
          type: string
          examples:
            - "sub_01"
        userId:
          type: string
          examples:
            - "usr_01HXYZ"
        planId:
          type: string
          examples:
            - "plan_01"
        kitchenId:
          type: string
          examples:
            - "ktn_01"
        deliveryTime:
          type: string
          examples:
            - "12:30 PM"
        status:
          type: string
          enum: [active, paused, cancelled, expired]
          examples:
            - active
        startDate:
          type: string
          format: date
          examples:
            - "2026-04-13"
        endDate:
          type: ["string", "null"]
          format: date
          examples:
            - "2026-04-30"
        pauseUntil:
          type: ["string", "null"]
          format: date
        cancelledAt:
          type: ["string", "null"]
          format: date-time
        cancellationReason:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # ------------------------------------------------------------------
    # Geo
    # ------------------------------------------------------------------

    GeoPlace:
      type: object
      required: [placeId, address, latitude, longitude]
      properties:
        placeId:
          type: string
          examples:
            - "ChIJ..."
        address:
          type: string
          examples:
            - "Koramangala, Bengaluru, Karnataka 560034"
        latitude:
          type: number
          format: float
          examples:
            - 12.9352
        longitude:
          type: number
          format: float
          examples:
            - 77.6245
        type:
          type: ["string", "null"]
          examples:
            - "neighborhood"

    # ------------------------------------------------------------------
    # Category Carousel item
    # ------------------------------------------------------------------

    CategoryCarouselItem:
      type: object
      required: [id, label, imageUrl, slug]
      properties:
        id:
          type: string
          examples:
            - "ccat_01"
        label:
          type: string
          examples:
            - "Thali"
        imageUrl:
          type: string
          format: uri
          examples:
            - "https://cdn.freshbhoj.com/categories/thali.jpg"
        slug:
          type: string
          examples:
            - "thali"

  # -------------------------------------------------------------------------
  # Reusable Responses
  # -------------------------------------------------------------------------

  responses:

    Unauthorized:
      description: Missing or invalid access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: "Access token is missing or invalid."

    Forbidden:
      description: Token valid but insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: FORBIDDEN
              message: "You do not have permission to perform this action."

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: "The requested resource was not found."

    ValidationError:
      description: Request body failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: "One or more fields are invalid."
              details:
                phoneNumber: "Must be exactly 10 digits."

    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            error:
              code: RATE_LIMITED
              message: "Too many requests. Please try again later."

# =============================================================================
# PATHS
# =============================================================================

paths:

  # ---------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------

  /auth/send-otp:
    post:
      tags: [Auth]
      summary: Send OTP
      description: |
        Sends a 6-digit OTP to the given phone number via SMS.
        - Max **3 requests per phone per 10 minutes**.
        - OTP is valid for **5 minutes**.
        - OTP is single-use only.
      operationId: sendOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber, countryCode]
              properties:
                phoneNumber:
                  $ref: '#/components/schemas/PhoneNumber'
                countryCode:
                  $ref: '#/components/schemas/CountryCode'
            example:
              phoneNumber: "9876543210"
              countryCode: "+91"
      responses:
        '200':
          description: OTP sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [message, expiresInSeconds, maskedPhone]
                    properties:
                      message:
                        type: string
                        examples:
                          - "OTP sent successfully"
                      expiresInSeconds:
                        type: integer
                        examples:
                          - 300
                      maskedPhone:
                        type: string
                        examples:
                          - "******3210"
        '400':
          description: Invalid phone number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error:
                  code: INVALID_PHONE
                  message: "Enter a valid 10-digit mobile number."
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: SMS gateway unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error:
                  code: SMS_GATEWAY_UNAVAILABLE
                  message: "Unable to send OTP right now. Please try again."

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify OTP
      description: |
        Verifies the OTP and returns a token pair.
        The `isNewUser` flag drives the frontend navigation decision:
        - `true` → navigate to `OTPSuccess → PersonalDetails`
        - `false` → navigate directly to `Home`

        Max **5 failed attempts** per OTP before it is locked.
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phoneNumber, countryCode, otp]
              properties:
                phoneNumber:
                  $ref: '#/components/schemas/PhoneNumber'
                countryCode:
                  $ref: '#/components/schemas/CountryCode'
                otp:
                  $ref: '#/components/schemas/OtpCode'
            example:
              phoneNumber: "9876543210"
              countryCode: "+91"
              otp: "482917"
      responses:
        '200':
          description: OTP verified. Tokens returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    allOf:
                      - $ref: '#/components/schemas/TokenPair'
                      - type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
        '400':
          description: OTP verification failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalid_otp:
                  summary: Wrong OTP
                  value:
                    success: false
                    error:
                      code: INVALID_OTP
                      message: "The OTP you entered is incorrect."
                otp_expired:
                  summary: OTP expired
                  value:
                    success: false
                    error:
                      code: OTP_EXPIRED
                      message: "This OTP has expired. Please request a new one."
                otp_already_used:
                  summary: OTP reused
                  value:
                    success: false
                    error:
                      code: OTP_ALREADY_USED
                      message: "This OTP has already been used."
                otp_locked:
                  summary: Too many failed attempts
                  value:
                    success: false
                    error:
                      code: OTP_LOCKED
                      message: "Too many incorrect attempts. Request a new OTP."
        '404':
          description: No active OTP found for this phone number
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error:
                  code: OTP_NOT_FOUND
                  message: "No active OTP found. Please request a new one."
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/refresh-token:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: |
        Exchange a valid refresh token for a new access token.
        The old refresh token is **revoked** on success (token rotation).
        Store the new refresh token in device Keychain.
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  examples:
                    - "rt_a1b2c3d4e5f6..."
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [accessToken, accessTokenExpiresAt]
                    properties:
                      accessToken:
                        type: string
                        examples:
                          - "eyJhbGciOiJSUzI1NiJ9..."
                      accessTokenExpiresAt:
                        type: string
                        format: date-time
                        examples:
                          - "2026-04-12T15:30:00Z"
        '401':
          description: Refresh token invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                invalid:
                  value:
                    success: false
                    error:
                      code: REFRESH_TOKEN_INVALID
                      message: "Refresh token is invalid or has been revoked."
                expired:
                  value:
                    success: false
                    error:
                      code: REFRESH_TOKEN_EXPIRED
                      message: "Refresh token has expired. Please log in again."

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Revokes the provided refresh token server-side. The access token will expire naturally (TTL 1h).
      operationId: logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
                  examples:
                    - "rt_a1b2c3d4e5f6..."
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        examples:
                          - "Logged out successfully."
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # User / Profile
  # ---------------------------------------------------------------------------

  /users/me:
    get:
      tags: [User]
      summary: Get my profile
      description: Returns the full profile of the authenticated user.
      operationId: getMyProfile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/profile:
    put:
      tags: [User]
      summary: Update personal details
      description: |
        Updates the user's personal details (name and email).
        Corresponds to **Step 0** of the PersonalDetails screen.
        Does **not** mark `profileComplete = true` — that requires a saved location too.
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  minLength: 2
                  maxLength: 100
                  examples:
                    - "Sumit Sharma"
                email:
                  type: ["string", "null"]
                  format: email
                  examples:
                    - "sumit@email.com"
                profileImageUrl:
                  type: ["string", "null"]
                  format: uri
                  description: URL of the uploaded profile image (use /media/upload-url to get an upload URL first)
      responses:
        '200':
          description: Profile updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        examples:
                          - "usr_01HXYZ"
                      fullName:
                        type: string
                        examples:
                          - "Sumit Sharma"
                      email:
                        type: string
                        format: email
                        examples:
                          - "sumit@email.com"
                      profileComplete:
                        type: boolean
                        examples:
                          - false
                      updatedAt:
                        type: string
                        format: date-time
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Email already in use by another account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error:
                  code: EMAIL_ALREADY_IN_USE
                  message: "This email is already linked to another account."

  /users/me/location:
    put:
      tags: [User]
      summary: Save delivery location
      description: |
        Saves the user's primary delivery location.
        Corresponds to **Step 1** of the PersonalDetails screen.
        Sets `profileComplete = true` once both profile and location are saved.
      operationId: updateMyLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, latitude, longitude]
              properties:
                address:
                  type: string
                  minLength: 5
                  maxLength: 255
                  examples:
                    - "Koramangala, Bengaluru, Karnataka 560034"
                latitude:
                  type: number
                  format: float
                  minimum: -90
                  maximum: 90
                  examples:
                    - 12.9352
                longitude:
                  type: number
                  format: float
                  minimum: -180
                  maximum: 180
                  examples:
                    - 77.6245
                landmark:
                  type: ["string", "null"]
                  maxLength: 100
                  examples:
                    - "Near Forum Mall"
      responses:
        '200':
          description: Location saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      location:
                        $ref: '#/components/schemas/Location'
                      profileComplete:
                        type: boolean
                        examples:
                          - true
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Geo / Address Search
  # ---------------------------------------------------------------------------

  /geo/search:
    get:
      tags: [Geo]
      summary: Autocomplete address search
      description: |
        Returns address suggestions for the location search bar
        in the PersonalDetails screen.
        Proxies to Google Places API or MapMyIndia — API keys are **never** exposed to the client.
      operationId: searchAddress
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 3
          description: Search query
          example: "Koramangala"
        - $ref: '#/components/parameters/LatParam'
        - $ref: '#/components/parameters/LngParam'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10
            default: 5
      responses:
        '200':
          description: Address suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GeoPlace'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Home Feed
  # ---------------------------------------------------------------------------

  /home/feed:
    get:
      tags: [Home]
      summary: Get home feed
      description: |
        Composite endpoint that returns all data for the Home screen in a single
        request: categories, kitchen stories, category carousel items, trending
        food items, and the active order card.

        Use the user's saved `location.latitude` / `location.longitude` if
        `lat` and `lng` are not provided in the query.
      operationId: getHomeFeed
      parameters:
        - $ref: '#/components/parameters/LatParam'
        - $ref: '#/components/parameters/LngParam'
        - $ref: '#/components/parameters/RadiusParam'
      responses:
        '200':
          description: Home feed data
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [categories, kitchenStories, categoryCarousel, trendingItems]
                    properties:
                      categories:
                        type: array
                        items:
                          $ref: '#/components/schemas/Category'
                      kitchenStories:
                        type: array
                        items:
                          $ref: '#/components/schemas/KitchenStory'
                      categoryCarousel:
                        type: array
                        items:
                          $ref: '#/components/schemas/CategoryCarouselItem'
                      trendingItems:
                        type: object
                        required: [items, total, page, limit]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: '#/components/schemas/FoodItem'
                          total:
                            type: integer
                            examples:
                              - 48
                          page:
                            type: integer
                            examples:
                              - 1
                          limit:
                            type: integer
                            examples:
                              - 12
                      activeOrder:
                        oneOf:
                          - type: "null"
                          - $ref: '#/components/schemas/ActiveOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Categories
  # ---------------------------------------------------------------------------

  /categories:
    get:
      tags: [Categories]
      summary: List all categories
      description: Returns the full list of food categories for the CategoryPills component.
      operationId: listCategories
      responses:
        '200':
          description: Category list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Category'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Kitchens
  # ---------------------------------------------------------------------------

  /kitchens:
    get:
