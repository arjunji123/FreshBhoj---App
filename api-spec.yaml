        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Food Items
  # ---------------------------------------------------------------------------

  /food-items:
    get:
      tags: [Food Items]
      summary: List food items
      description: |
        Search and list food items with filtering and sorting.
        Used for the Trending Near You grid and the future Search screen.
      operationId: listFoodItems
      parameters:
        - $ref: '#/components/parameters/LatParam'
        - $ref: '#/components/parameters/LngParam'
        - $ref: '#/components/parameters/RadiusParam'
        - name: categorySlug
          in: query
          schema:
            type: string
          description: Filter by category slug
          example: "curry"
        - name: sort
          in: query
          schema:
            type: string
            enum: [trending, rating, price_asc, price_desc, distance]
            default: trending
          description: Sort order
        - name: isVeg
          in: query
          schema:
            type: boolean
          description: Filter to vegetarian items only
        - name: maxPriceRs
          in: query
          schema:
            type: integer
            minimum: 0
          description: Maximum price in rupees
          example: 300
        - name: kitchenId
          in: query
          schema:
            type: string
          description: Filter to a specific kitchen
        - name: q
          in: query
          schema:
            type: string
            minLength: 2
          description: Full-text search query
          example: "paneer"
        - $ref: '#/components/parameters/PageParam'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 12
      responses:
        '200':
          description: Food item list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FoodItem'
                  meta:
                    $ref: '#/components/schemas/PaginatedMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /food-items/favorites:
    get:
      tags: [Food Items]
      summary: Get my favourites
      description: Returns the authenticated user's favourited food items.
      operationId: listFavorites
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Favourite food items
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FoodItem'
                  meta:
                    $ref: '#/components/schemas/PaginatedMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /food-items/{foodItemId}:
    get:
      tags: [Food Items]
      summary: Get food item detail
      description: Full detail for a single food item (for future food item detail screen).
      operationId: getFoodItem
      parameters:
        - name: foodItemId
          in: path
          required: true
          schema:
            type: string
          example: "food_01"
      responses:
        '200':
          description: Food item detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/FoodItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /food-items/{foodItemId}/favorite:
    post:
      tags: [Food Items]
      summary: Toggle favourite
      description: |
        Toggles the favourite state of a food item for the authenticated user.
        Calling this on an already-favourited item removes it.
        Triggered by the heart icon on `FoodCard`.
      operationId: toggleFavorite
      parameters:
        - name: foodItemId
          in: path
          required: true
          schema:
            type: string
          example: "food_01"
      requestBody:
        description: No body required — this is a pure toggle.
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Toggle result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [foodItemId, isFavorite]
                    properties:
                      foodItemId:
                        type: string
                        examples:
                          - "food_01"
                      isFavorite:
                        type: boolean
                        examples:
                          - true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Orders
  # ---------------------------------------------------------------------------

  /orders/active:
    get:
      tags: [Orders]
      summary: Get active order
      description: |
        Returns the user's currently active order or tiffin subscription.
        This populates the `ActiveTiffinCard` on the Home screen.
        Returns `null` in `data` if the user has no active order.
      operationId: getActiveOrder
      responses:
        '200':
          description: Active order (or null)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    oneOf:
                      - type: "null"
                      - $ref: '#/components/schemas/ActiveOrder'
              examples:
                with_active_order:
                  summary: Active order exists
                  value:
                    success: true
                    data:
                      id: "ord_01"
                      title: "Daily Lunch Tiffin"
                      type: "subscription"
                      status: "delivering_today"
                      statusLabel: "Delivering Today"
                      statusColor: "#22C55E"
                      nextDeliveryTime: "12:30 PM"
                      nextDeliveryDate: "2026-04-12"
                      kitchenName: "Amma's Kitchen"
                      kitchenId: "ktn_01"
                no_active_order:
                  summary: No active order
                  value:
                    success: true
                    data: null
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/active/schedule:
    get:
      tags: [Orders]
      summary: Get active order schedule
      description: |
        Returns the full upcoming delivery schedule for the active tiffin subscription.
        Triggered by the "View Schedule" button on `ActiveTiffinCard`.
      operationId: getActiveOrderSchedule
      responses:
        '200':
          description: Delivery schedule
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [orderId, deliveries]
                    properties:
                      orderId:
                        type: string
                        examples:
                          - "ord_01"
                      deliveries:
                        type: array
                        items:
                          $ref: '#/components/schemas/DeliveryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders:
    get:
      tags: [Orders]
      summary: List order history
