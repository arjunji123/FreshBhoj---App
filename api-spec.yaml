        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
          description: Filter by status
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Order history
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderDetail'
                  meta:
                    $ref: '#/components/schemas/PaginatedMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get order detail
      operationId: getOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          example: "ord_01"
      responses:
        '200':
          description: Order detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Subscriptions
  # ---------------------------------------------------------------------------

  /subscriptions/plans:
    get:
      tags: [Subscriptions]
      summary: List subscription plans
      description: Returns available tiffin subscription plans for a specific kitchen.
      operationId: listSubscriptionPlans
      parameters:
        - name: kitchenId
          in: query
          required: true
          schema:
            type: string
          description: Kitchen whose plans to fetch
          example: "ktn_01"
      responses:
        '200':
          description: Subscription plans
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubscriptionPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subscriptions:
    get:
      tags: [Subscriptions]
      summary: List my subscriptions
      description: Returns all active and past subscriptions for the authenticated user.
      operationId: listSubscriptions
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, paused, cancelled, expired]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Subscription list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subscription'
                  meta:
                    $ref: '#/components/schemas/PaginatedMeta'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags: [Subscriptions]
      summary: Create a subscription
      description: Subscribe to a tiffin plan from a kitchen.
      operationId: createSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planId, deliveryAddressId, startDate, deliveryTime]
              properties:
                planId:
                  type: string
                  examples:
                    - "plan_01"
                deliveryAddressId:
                  type: string
                  description: ID of user's saved location
                  examples:
                    - "addr_01"
                startDate:
                  type: string
                  format: date
                  description: Must be a future date
                  examples:
                    - "2026-04-13"
                deliveryTime:
                  type: string
                  description: Must be one of the plan's deliveryTimes
                  examples:
                    - "12:30 PM"
                paymentMethodId:
                  type: ["string", "null"]
                  examples:
                    - "pm_01"
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [subscriptionId, status, nextDeliveryDate, orderId]
                    properties:
                      subscriptionId:
                        type: string
                        examples:
                          - "sub_01"
                      status:
                        type: string
                        examples:
                          - "active"
                      nextDeliveryDate:
                        type: string
                        format: date
                        examples:
                          - "2026-04-13"
                      orderId:
                        type: string
                        examples:
                          - "ord_01"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subscriptions/{subscriptionId}/pause:
    patch:
      tags: [Subscriptions]
      summary: Pause a subscription
      operationId: pauseSubscription
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
          example: "sub_01"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pauseUntil]
              properties:
                pauseUntil:
                  type: string
                  format: date
                  examples:
                    - "2026-04-20"
      responses:
        '200':
          description: Subscription paused
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /subscriptions/{subscriptionId}:
    delete:
      tags: [Subscriptions]
      summary: Cancel a subscription
      operationId: cancelSubscription
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
          example: "sub_01"
        - name: reason
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
          description: Cancellation reason
          example: "Too expensive"
      responses:
        '200':
          description: Subscription cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        examples:
                          - "Subscription cancelled successfully."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Cart
  # ---------------------------------------------------------------------------

  /cart:
    get:
      tags: [Cart]
      summary: Get cart
      description: Returns the current cart for the authenticated user.
      operationId: getCart
      responses:
        '200':
          description: Current cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      tags: [Cart]
      summary: Clear cart
      description: Removes all items from the cart.
      operationId: clearCart
      responses:
        '200':
          description: Cart cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        examples:
                          - "Cart cleared."
        '401':
          $ref: '#/components/responses/Unauthorized'

  /cart/items:
    post:
      tags: [Cart]
      summary: Add item to cart
      description: |
        Adds a food item to the cart. Triggered by the "+" button on `FoodCard`.

        **Cross-kitchen rule:** All items in the cart must belong to the same kitchen.
        If the user tries to add an item from a different kitchen, the API returns `409 CROSS_KITCHEN_CONFLICT`.
        The frontend must ask the user to confirm clearing the existing cart before retrying.
      operationId: addCartItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [foodItemId, quantity]
              properties:
                foodItemId:
                  type: string
                  examples:
                    - "food_01"
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 10
                  examples:
                    - 1
      responses:
        '200':
          description: Item added. Returns updated cart.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/Cart'
        '400':
          description: Item not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error:
                  code: ITEM_UNAVAILABLE
                  message: "This item is currently unavailable."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Item from a different kitchen than existing cart items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                error:
                  code: CROSS_KITCHEN_CONFLICT
                  message: "Your cart has items from another kitchen. Clear the cart to add this item."
                  details:
                    existingKitchenId: "ktn_01"
                    existingKitchenName: "Amma's Kitchen"
                    newKitchenId: "ktn_02"
                    newKitchenName: "Ritu's Dabba"

  /cart/items/{cartItemId}:
    patch:
      tags: [Cart]
      summary: Update cart item quantity
      operationId: updateCartItem
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: string
          example: "citem_01"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity:
                  type: integer
                  minimum: 1
                  maximum: 10
                  examples:
                    - 3
      responses:
        '200':
          description: Cart updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Cart]
      summary: Remove cart item
      operationId: removeCartItem
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: string
          example: "citem_01"
      responses:
        '200':
          description: Item removed. Returns updated cart.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Search
  # ---------------------------------------------------------------------------

  /search:
    get:
      tags: [Search]
      summary: Unified search
      description: |
        Search across food items and kitchens simultaneously.
        Powers the future Search tab.
      operationId: search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
          description: Search query
          example: "paneer"
        - $ref: '#/components/parameters/LatParam'
        - $ref: '#/components/parameters/LngParam'
        - name: type
          in: query
          schema:
            type: string
            enum: [food, kitchen, all]
            default: all
          description: Restrict results to a specific type
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [query, total, foodItems, kitchens]
                    properties:
                      query:
                        type: string
                        examples:
                          - "paneer"
                      total:
                        type: integer
                        examples:
                          - 42
                      foodItems:
                        type: array
                        items:
                          $ref: '#/components/schemas/FoodItem'
                      kitchens:
                        type: array
                        items:
                          $ref: '#/components/schemas/KitchenSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------------
  # Media Upload
  # ---------------------------------------------------------------------------

  /media/upload-url:
    post:
      tags: [Media]
      summary: Get pre-signed upload URL
      description: |
        Generates a short-lived pre-signed URL for direct client-to-storage upload
        (S3 or GCS). The client uploads the file directly to the URL, then passes
        the returned `publicUrl` to the profile update endpoint.

        **Never upload files to the API server directly.**
      operationId: getUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType, purpose]
              properties:
                contentType:
                  type: string
                  enum:
                    - image/jpeg
                    - image/png
                    - image/webp
                  examples:
                    - "image/jpeg"
                purpose:
                  type: string
                  enum:
                    - profile_avatar
                    - food_image
                    - kitchen_image
                  examples:
                    - "profile_avatar"
      responses:
        '200':
          description: Pre-signed upload URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum: [true]
                  data:
                    type: object
                    required: [uploadUrl, publicUrl, expiresAt]
                    properties:
                      uploadUrl:
                        type: string
                        format: uri
                        description: PUT this URL with the file binary. TTL 5 minutes.
                        examples:
                          - "https://storage.freshbhoj.com/presigned/..."
                      publicUrl:
                        type: string
                        format: uri
                        description: CDN URL to use in subsequent profile update calls.
                        examples:
                          - "https://cdn.freshbhoj.com/users/usr_01HXYZ/avatar.jpg"
                      expiresAt:
                        type: string
                        format: date-time
                        examples:
                          - "2026-04-12T12:15:00Z"
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

# =============================================================================
# Tags (for Swagger UI grouping)
# =============================================================================

tags:
  - name: Auth
    description: OTP-based phone authentication
  - name: User
    description: User profile and location management
  - name: Geo
    description: Address geocoding and autocomplete
  - name: Home
    description: Composite home feed endpoint
  - name: Categories
    description: Food category management
  - name: Kitchens
    description: Kitchen listings and detail
  - name: Food Items
    description: Food item discovery, search, and favourites
  - name: Orders
    description: Order history and active order tracking
  - name: Subscriptions
    description: Tiffin subscription plans and management
  - name: Cart
    description: Shopping cart operations
  - name: Search
    description: Unified full-text search
  - name: Media
    description: File upload URL generation
